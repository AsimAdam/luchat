[project]
name = "luchat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "asim", email = "asim_ad@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
luchat = "luchat:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]